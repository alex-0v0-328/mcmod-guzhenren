name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: guzhenren-template-1.21.1
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Epic Fight
        working-directory: guzhenren-template-1.21.1
        run: |
          mkdir -p run/mods
          epic_fight_file=epic-fight-21.17.3.1-mc1.21.1-neoforge.jar
          epic_fight_url=$(curl --fail --silent --retry 3 --retry-all-errors https://api.modrinth.com/v2/version/8HHhJt6i | jq -er --arg file "$epic_fight_file" '.files[] | select(.filename == $file) | .url')
          curl --fail --location --retry 3 "$epic_fight_url" -o "run/mods/$epic_fight_file"

      # The build script references this jar from run/mods, which is gitignored; CI fetches it.
      - name: Download GeckoLib
        working-directory: guzhenren-template-1.21.1
        run: |
          mkdir -p run/mods
          geckolib_file=geckolib-neoforge-1.21.1-4.9.3.jar
          geckolib_url=$(curl --fail --silent --retry 3 --retry-all-errors https://api.modrinth.com/v2/version/Grwn5rUB | jq -er --arg file "$geckolib_file" '.files[] | select(.filename == $file) | .url')
          curl --fail --location --retry 3 "$geckolib_url" -o "run/mods/$geckolib_file"

      - name: Download Photon
        working-directory: guzhenren-template-1.21.1
        run: |
          mkdir -p run/mods
          photon_file=photon-neoforge-1.21.1-2.2.11-all.jar
          photon_url=$(curl --fail --silent --retry 3 --retry-all-errors https://api.modrinth.com/v2/version/wSiq87dk | jq -er --arg file "$photon_file" '.files[] | select(.filename == $file) | .url')
          curl --fail --location --retry 3 "$photon_url" -o "run/mods/$photon_file"

      # LDLib2 ships only on the author's snapshot Maven, which may republish a version, so the hash pins it.
      - name: Download LDLib2
        working-directory: guzhenren-template-1.21.1
        run: |
          mkdir -p run/mods
          ldlib_file=ldlib2-neoforge-1.21.1-2.2.46.a-all.jar
          curl --fail --location --retry 3 "https://maven.firstdark.dev/snapshots/com/lowdragmc/ldlib2/ldlib2-neoforge-1.21.1/2.2.46.a/$ldlib_file" -o "run/mods/$ldlib_file"
          echo "5b0330f38e4a68f6c585b387c6f2f31ba7e5af0dc07a69ccdc98731379acbeeb  run/mods/$ldlib_file" | sha256sum -c -

      # The test suites are local-only (src/test is gitignored) and run before every push through
      # the maintainer's ship tool, so CI compiles, packages and checks generated data.
      - name: Build with Gradle
        working-directory: guzhenren-template-1.21.1
        run: ./gradlew build

      # src/generated/resources is a committed source set, and 'build' happily packs a stale one.
      # git diff alone would miss a provider change that ADDS a file, so this asks git status.
      - name: Generated resources are up to date
        working-directory: guzhenren-template-1.21.1
        run: |
          ./gradlew runData
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            echo "::error::src/generated is stale. Run ./gradlew runData and commit the result."
            git status --porcelain -- src/generated
            git --no-pager diff -- src/generated
            exit 1
          fi
