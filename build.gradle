plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
        exclude '**/*.bbmodel' // BlockBench project files
        exclude '.cache/**'
    }
    test {
        java.srcDirs = ['src/test/modded/java']
        resources.srcDirs = ['src/test/modded/resources']
    }
    pureTest {
        java.srcDirs = ['src/test/pure/java']
        resources.srcDirs = ['src/test/pure/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    gametest {
        java.srcDirs = ['src/test/game/java']
        resources.srcDirs = ['src/test/game/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            // The pack mods ship SRG-named mixin refmaps; remap them to the dev names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    if (file('src/test/game/java').isDirectory()) {
                        source sourceSets.gametest
                    }
                }
            }
        }

        client {}

        server {
            workingDirectory project.file(providers.gradleProperty('serverGameDir').getOrElse('run'))
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    maven {
        name = 'Illusive Soulworks maven'
        url = 'https://maven.theillusivec4.top/'
    }
    // The test pack's jars. They are SRG-named, so the dev run loads them remapped through
    // fg.deobf below instead of from run/mods.
    flatDir {
        dirs 'pack/mods'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly fg.deobf("blank:${epic_fight_jar - '.jar'}:0")
    compileOnly fg.deobf("blank:${geckolib_jar - '.jar'}:0")

    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // Mods whose mixins name SRG targets without a refmap only load in a production instance.
    // Every run shares one classpath, so -PserverRun also drops the client-only mods for runServer.
    def devExcluded = dev_excluded_mods.split(',')*.trim().findAll { it }
    if (providers.gradleProperty('serverRun').isPresent()) {
        devExcluded += client_only_mods.split(',')*.trim().findAll { it }
    }
    // -PdataRun keeps only the mod's hard dependencies: the pack's other mods are noise to data generation,
    // and some (client UI mods) fail to construct without a client.
    def dataRun = providers.gradleProperty('dataRun').isPresent()
    fileTree(dir: 'pack/mods', include: '*.jar').findAll { jar ->
        !devExcluded.any { jar.name.startsWith(it) } && (!dataRun || jar.name in [epic_fight_jar, geckolib_jar])
    }.each { jar ->
        runtimeOnly fg.deobf("blank:${jar.name - '.jar'}:0")
    }

    pureTestImplementation platform("org.junit:junit-bom:${junit_version}")
    pureTestImplementation 'org.junit.jupiter:junit-jupiter'
    pureTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('pureTest', Test) {
    description = 'Runs the L1 pure JUnit tests.'
    group = 'verification'
    testClassesDirs = sourceSets.pureTest.output.classesDirs
    classpath = sourceSets.pureTest.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'gzr.projectDir', projectDir.absolutePath
}
tasks.named('check') { dependsOn 'pureTest' }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Lets a console 'stop' (or a piped one from a smoke script) reach the dev server.
tasks.matching { it.name == 'runServer' }.configureEach { standardInput = System.in }
