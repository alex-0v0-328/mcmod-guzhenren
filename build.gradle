plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    // Datagen cache files. Patterns are relative to each resource root, and the cache sits at the root
    // of src/generated/resources, so the template's "src/generated/**/.cache" never matched.
    exclude('.cache/**')
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Every test lives under src/test, one folder per layer, and none of them ships in the jar:
//   pure    L1 'pureTest': plain JVM JUnit, nothing booted -- formulas, codecs and resource files.
//           Anything touching a registered object (ModItems.X.get(), ItemStack, Items.X, MobEffect, an
//           entity type) or whose class loads a registry is L2.
//   game    L2 'gametest': @GameTest classes plus their scene templates, run by runGameTestServer
//           on a real dedicated server. The source set joins the mod below, so dev runs still find
//           the tests (and the /test command), while the jar task packs only 'main'.
sourceSets {
    gametest {
        java.srcDirs = ['src/test/game/java']
        resources.srcDirs = ['src/test/game/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // The pure tests share the wiki table parser with the GameTests that check the item tables.
    pureTest {
        java.srcDirs = ['src/test/pure/java']
        resources.srcDirs = ['src/test/pure/resources']
        compileClasspath += sourceSets.main.output + sourceSets.gametest.output
        runtimeClasspath += sourceSets.main.output + sourceSets.gametest.output
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // -PclientGameDir=<dir> and -PquickPlayServer=<host:port>: tools/local_checks.py's multiplayer smoke test
        // boots a client in a throwaway game directory, so its mods are the classpath's alone, the same as the
        // smoke server's, and joins that server at once. Without the properties nothing changes.
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file(providers.gradleProperty('clientGameDir').getOrElse('run'))
            if (providers.gradleProperty('quickPlayServer').isPresent()) {
                programArguments.addAll '--quickPlayMultiplayer', providers.gradleProperty('quickPlayServer').get()
            }
        }

        // -PserverGameDir=<dir> swaps the game directory for a throwaway one: tools/local_checks.py boots
        // its server smoke test there, so the pack mirror in run/mods (some of whose jars crash a
        // dedicated server) and the run/ world stay out. Without the property nothing changes.
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file(providers.gradleProperty('serverGameDir').getOrElse('run'))
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        // Its own game directory keeps the pack mirror in run/mods out: some of those jars crash a
        // dedicated server, while the mod under test and its compile-time dependencies (Epic Fight,
        // GeckoLib) still load from the classpath.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            // Under build/: every IDE sync creates this directory, and tools/local_checks.py passes its own.
            gameDirectory = project.file(providers.gradleProperty('gameTestDir').getOrElse('build/run-gametest'))
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // -PwikiDir turns on the wiki item-table GameTests (WikiItemsGameTests), as it does pureTest's wiki gate.
            if (providers.gradleProperty('wikiDir').isPresent()) {
                systemProperty 'gzr.wikiDir', file(providers.gradleProperty('wikiDir').get()).absolutePath
            }
            // The run is boot-bound (mod loading outweighs the test ticks several times over), so C1-only JIT
            // finishes sooner than tiered C2, which never pays back in a run this short.
            jvmArgument '-XX:TieredStopAtLevel=1'
        }

        data {
            data()

            // Under build/ for the same reason as the GameTest directory.
            gameDirectory = project.file(providers.gradleProperty('dataGameDir').getOrElse('build/run-data'))

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // src/test is local-only (gitignored), so a CI checkout has no GameTests to join.
            if (file('src/test/game/java').isDirectory()) {
                sourceSet(sourceSets.gametest)
            }
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Gu World, the sibling project at ../mcmod-guworld (or -PguWorldDir), supplies every dimension, terrain
// and biome. Its built jar joins the runs as a mod, the GameTest server included, while this mod never
// compiles against it. An unbuilt sibling (or CI, which has none) simply adds nothing.
def guWorldLibs = file(providers.gradleProperty('guWorldDir').getOrElse('../mcmod-guworld') + '/build/libs')

dependencies {
    compileOnly files('run/mods/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar')
    localRuntime files('run/mods/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar')

    compileOnly files('run/mods/geckolib-neoforge-1.21.1-4.9.3.jar')
    localRuntime files('run/mods/geckolib-neoforge-1.21.1-4.9.3.jar')

    localRuntime fileTree(dir: guWorldLibs, include: 'guworld-*.jar', exclude: '*-sources.jar')
}

def junitGameDir = project.file('build/minecraft-junit')

neoForge.addModdingDependenciesTo sourceSets.pureTest

// GameTests compile against everything the mod compiles against and run with its runtime extras.
neoForge.addModdingDependenciesTo sourceSets.gametest
configurations {
    gametestCompileOnly.extendsFrom compileOnly
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom localRuntime, runtimeOnly
}

dependencies {
    pureTestImplementation platform("org.junit:junit-bom:${junit_version}")
    pureTestImplementation "org.junit.jupiter:junit-jupiter"
    pureTestRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // The animation and model tests parse GeckoLib's baked formats; the dash ring test loads Epic Fight's types.
    pureTestImplementation files('run/mods/geckolib-neoforge-1.21.1-4.9.3.jar')
    pureTestRuntimeOnly files('run/mods/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar')
}

tasks.register('pureTest', Test) {
    description = 'Runs the pure JVM test source set without loading the mod.'
    group = 'verification'
    workingDir junitGameDir
    // The test process cannot start in a missing directory: after a clean (Gu World's check builds this
    // project's jar from clean) nothing else has created it.
    doFirst { junitGameDir.mkdirs() }
    testClassesDirs = sourceSets.pureTest.output.classesDirs
    classpath = sourceSets.pureTest.runtimeClasspath
    useJUnitPlatform()
    // The JVM lives for seconds and spends them loading classes: C1-only JIT starts it faster.
    jvmArgs '-XX:TieredStopAtLevel=1'
    systemProperty 'gzr.projectDir', projectDir.absolutePath
    if (providers.gradleProperty('wikiDir').isPresent()) {
        def configuredWikiDir = providers.gradleProperty('wikiDir').get()
        // Set the raw value before the blank check: the wiki test skips on an unset property but
        // fails on a blank one, so an explicit -PwikiDir= must stay non-null.
        systemProperty 'gzr.wikiDir', configuredWikiDir
        if (!configuredWikiDir.isBlank()) {
            def wikiRoot = file(configuredWikiDir)
            systemProperty 'gzr.wikiDir', wikiRoot.absolutePath
            inputs.files([
                    '玩家向/蛊真人MOD 1.0.0 蛊材、蛊虫与炼蛊.md',
                    '玩家向/蛊真人MOD 1.0.0 角色.md',
                    '玩家向/蛊真人MOD 1.0.0 总表.md',
                    '开发向-guzhenren/维护说明.md'
            ].collect { new File(wikiRoot, it) })
            inputs.files(fileTree('src/test'))
        }
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
check.dependsOn pureTest

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
